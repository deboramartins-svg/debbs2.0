<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Debbs'Finds</title>
    
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&amp;family=Montserrat:wght@300;400;500;600&amp;family=Playfair+Display:ital,wght@0,400;1,400&amp;display=swap" rel="stylesheet"/>
    
    <link rel="stylesheet" href="style.css">

    <script>
        tailwind.config = {
          darkMode: 'class',
          theme: {
            extend: {
              colors: {
                customPurple: '#420A71', 
                brandLavender: '#f3f0ff',
                brandPurple: '#e0d7ff',
                brandDark: '#333333',
              },
              fontFamily: {
                serif: ['Playfair Display', 'serif'],
                script: ['Dancing Script', 'cursive'],
                sans: ['Montserrat', 'sans-serif'],
              }
            }
          }
        }
    </script>
</head>

<body class="font-sans text-gray-600 bg-white dark:bg-black dark:text-gray-200 transition-colors duration-300 min-h-screen flex flex-col justify-between">

    <div class="w-full">
        <!-- Banner no Topo -->
        <div class="relative w-full h-48 md:h-64 overflow-hidden bg-purple-200 dark:bg-purple-950" data-purpose="site-header">
            <img src="assets/banner.jpg" alt="Banner Debbs Achadinhos" class="w-full h-full object-cover">
        </div>

       <!-- Perfil e Informações -->
        <div class="max-w-xl mx-auto px-4 text-center relative pb-6">
            <!-- Foto de Perfil Circular Menor -->
            <div class="relative -mt-16 mb-3 inline-block">
                <div class="w-28 h-28 md:w-32 md:h-32 rounded-full overflow-hidden border-4 border-white shadow-md bg-white mx-auto">
                    <img src="assets/perfil.jpeg" alt="Foto de Perfil" class="w-full h-full object-cover">
                </div>
            </div>

            <!-- Nome -->
            <div class="flex flex-col items-center mb-2">
                <div class="relative inline-block px-10">
                    <h1 class="text-3xl md:text-4xl font-script text-brandDark">Debbs'Finds</h1>
                </div>
            </div>

           <!-- Bio -->
            <div class="relative inline-flex items-center justify-center gap-2 mb-6 px-4">
                <p class="text-xs md:text-sm text-gray-700 font-medium">
                    • Melhores achados e promoções para vc •
                </p>
            </div>

           <!-- Redes sociais -->
            <div class="flex justify-center items-center gap-3 mb-8" data-purpose="social-links">
                <!-- Pinterest -->
                <a href="https://br.pinterest.com/debbs_debbs/" target="_blank" class="w-9 h-9 rounded-full bg-white border border-gray-200 flex items-center justify-center text-gray-700 hover:scale-110 hover:border-black transition-all shadow-sm" aria-label="Pinterest">
                    <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12 0c-6.627 0-12 5.372-12 12 0 5.084 3.163 9.426 7.627 11.174-.105-.949-.2-2.405.042-3.441.218-.937 1.407-5.965 1.407-5.965s-.359-.719-.359-1.782c0-1.668.967-2.914 2.171-2.914 1.023 0 1.518.769 1.518 1.69 0 1.029-.655 2.568-.994 3.995-.283 1.194.599 2.169 1.777 2.169 2.133 0 3.772-2.249 3.772-5.495 0-2.873-2.064-4.882-5.012-4.882-3.414 0-5.418 2.561-5.418 5.207 0 1.031.397 2.138.893 2.738.098.119.112.224.083.345-.09.375-.291 1.199-.332 1.363-.053.225-.172.271-.399.165-1.493-.695-2.425-2.875-2.425-4.623 0-3.765 2.738-7.229 7.892-7.229 4.144 0 7.365 2.953 7.365 6.905 0 4.122-2.6 7.433-6.208 7.433-1.211 0-2.351-.63-2.738-1.373l-.746 2.848c-.269 1.045-1.004 2.352-1.498 3.146 1.123.345 2.306.535 3.522.535 6.627 0 12-5.373 12-12 0-6.628-5.373-12-12-12z"/></svg>
                </a>
                
                <!-- TikTok -->
                <a href="https://www.tiktok.com/@debbsbydebbs?_r=1&_t=ZS-98HFbc5wtVf" target="_blank" class="w-9 h-9 rounded-full bg-white border border-gray-200 flex items-center justify-center text-gray-700 hover:scale-110 hover:border-black transition-all shadow-sm" aria-label="TikTok">
                    <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/></svg>
                </a>
            </div>

        <!-- Main Cards Ajustados -->
        <main class="max-w-xl mx-auto px-4 pb-12" data-purpose="category-grid">
            <div class="grid grid-cols-1 gap-3">
                
                <!-- Card 1: Grupo de Promoções (WhatsApp) -->
                <a href="https://chat.whatsapp.com/CbJSvj4vgcdDjsfdF42BpG" target="_blank" class="category-card rounded-2xl bg-white border border-purple-100 p-3 flex items-center gap-3 hover:border-purple-400 hover:shadow-md transition-all">
                    <div class="w-12 h-12 flex-shrink-0 bg-emerald-50 rounded-xl overflow-hidden flex items-center justify-center p-2">
                        <img alt="Grupo de Promoções WhatsApp" class="w-full h-full object-contain" src="assets/whatsapp.png"/>
                    </div>
                    <h2 class="text-xs md:text-sm font-semibold tracking-wider text-brandDark flex-grow whitespace-nowrap overflow-hidden text-ellipsis">✨GRUPO DE PROMOÇÕES✨</h2>
                    <div class="text-black font-bold pr-2 text-sm">></div>
                </a>

                <!-- Card 2: Link de Produtos SHEIN -->
                <a href="https://onelink.shein.com/44/5wn6qrvzme4z" target="_blank" class="category-card rounded-2xl bg-white border border-purple-100 p-3 flex items-center gap-3 hover:border-purple-400 hover:shadow-md transition-all">
                    <div class="w-12 h-12 flex-shrink-0 bg-white border border-gray-100 rounded-xl overflow-hidden flex items-center justify-center p-2">
                        <img alt="Produtos SHEIN" class="w-full h-full object-contain" src="assets/shein.png"/>
                    </div>
                    <h2 class="text-xs md:text-sm font-semibold tracking-wider text-brandDark flex-grow whitespace-nowrap overflow-hidden text-ellipsis">Links de Produtos SHEIN</h2>
                    <div class="text-black font-bold pr-2 text-sm">></div>
                </a>

                <!-- Card 3: Link de Produtos Shopee -->
                <a href="https://collshp.com/debbsfinds" target="_blank" class="category-card rounded-2xl bg-white border border-purple-100 p-3 flex items-center gap-3 hover:border-purple-400 hover:shadow-md transition-all">
                    <div class="w-12 h-12 flex-shrink-0 bg-orange-50 rounded-xl overflow-hidden flex items-center justify-center p-2">
                        <img alt="Produtos Shopee" class="w-full h-full object-contain" src="assets/shopee.png"/>
                    </div>
                    <h2 class="text-xs md:text-sm font-semibold tracking-wider text-brandDark flex-grow whitespace-nowrap overflow-hidden text-ellipsis">Links de Produtos Shopee</h2>
                    <div class="text-black font-bold pr-2 text-sm">></div>
                </a>

            </div>
        </main>
    </div>

    <!-- Footer Modernizado -->
    <footer class="bg-white/60 dark:bg-gray-900/80 backdrop-blur-md py-6 px-6 border-t border-gray-100 dark:border-gray-800" data-purpose="footer">
        <div class="max-w-xl mx-auto flex justify-center items-center">
            <button id="btn-abrir-modal" 
                    class="bg-black text-white px-5 py-2 rounded-full text-xs font-medium hover:bg-gray-800 transition-all shadow-sm">
                Sugestões
            </button>
        </div>
    </footer>

    <!-- Modal de Sugestões -->
    <div id="modal-sugestao" class="fixed inset-0 bg-black/40 backdrop-blur-xs hidden flex items-center justify-center z-[100] p-4">
        <div id="modal-conteudo" class="bg-white border border-gray-200 p-6 rounded-3xl w-full max-w-sm shadow-2xl relative">
            <button id="btn-fechar" class="absolute top-4 right-4 text-gray-400 hover:text-black text-xl transition-colors">✕</button>
            <h3 class="text-base font-semibold mb-4 text-gray-900 text-center tracking-wide">✰ Sua opinião é importante! ✰</h3>
            <form id="form-sugestao" action="https://formspree.io/f/mjgdjgyz" method="POST" class="flex flex-col gap-4">
                <textarea name="mensagem" required placeholder="Escreva aqui..." class="w-full p-4 bg-gray-50 border border-gray-200 rounded-2xl h-32 outline-none focus:border-black focus:ring-1 focus:ring-black text-sm text-gray-800 transition-all"></textarea>
                
                <button type="submit" class="bg-black text-white py-3 rounded-2xl font-medium text-sm hover:bg-gray-800 transition-all shadow-sm">
                    Enviar
                </button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
